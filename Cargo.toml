[package]
name = "cidian"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

authors = ["Hao Cheng"]
description = "Parsers for Chinese input-method dictionary formats"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Yousa-Mirage/cidian"
homepage = "https://github.com/Yousa-Mirage/cidian"

keywords = ["chinese", "dictionary", "scel", "sogou"]
categories = ["parser-implementations", "text-processing"]

exclude = ["**/*.scel", "**/*.xml", "tests/**"]

[dependencies]
thiserror = "2.0"

[lints.clippy]
expect_used = "deny"
module-inception = "allow"
unwrap_used = "deny"

[lints.rust]
dead_code = "deny"
warnings = "deny"
