[package]
name = "cidian"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

authors = ["Hao Cheng"]
description = "Parsers for Chinese input-method dictionary formats"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Yousa-Mirage/cidian"
homepage = "https://github.com/Yousa-Mirage/cidian"

keywords = ["chinese", "dictionary", "sogou", "scel"]
categories = ["text-processing", "parser-implementations"]

exclude = ["tests/**", "**/*.scel"]

[dependencies]
thiserror = "2.0"

[lints.rust]
warnings = "deny"
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
module-inception = "allow"
